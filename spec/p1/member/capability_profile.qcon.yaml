# Exact owner Member V0104 source-bound candidate projection; not a separate business authority.
# Owner Source: spec/p1/member/source_snapshot/Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER.V0104.yaml
# Whitelist and runtime/permission Gate closure remain UNRESOLVED.
q_header: '1'
q_id: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER
q_version: V0104
q_stage: P1
q_role: capability_profile_projection
q_status: candidate

identity:
  capability_ref: Q.MEMBERSHIP.CAPABILITY.MEMBER@V0104
  capability_id: member
  capability_version: V0104
  stable_code: MEMBER
  canonical_name: member
  capability_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104
  capability_contract_integrity_binding_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/capability_contract_integrity_binding
  identity_mode: CANONICAL_NEW_CAPABILITY_CONTRACT
  contract_version_equals_capability_version: true
  one_exact_contract_for_this_capability_version: true
  repository_owner_namespace: Q.MEMBERSHIP
  repository_owner_namespace_predeclaration_unverified: true
ownership:
  stage_contract_ref: Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}
  runtime_contract_ref: Q.SS.STD.P0.CONTRACT.RUNTIME_CORE@${CURRENT}
  capability_semantic_owner: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104
  repository_static_scope: Q.MEMBERSHIP
  repository_static_scope_is_physical_attribution_only: true
  domain_contract_required: false
purpose:
  business_goal: 统一管理稳定会员身份、可维护会员档案及生命周期、会员与外部方案的有效及历史关系，并在指定时点确定会员关系有效性资格。
  supported_consumers: 其他模块和能力通过明确声明的公开业务接口调用，而不复制会员内部规则。
  does_not_own:
  - 登录认证
  - 支付交易和退款
  - 营销活动执行
  - 商品和订单
  - 积分核算
  - 权益履约
  business_fact_separations:
  - 会员存在不等于会员关系在指定时点有效
  - 会员生命周期状态独立于会员关系的生效区间和更换状态
  - 会员关系有效性判断不蕴含支付成功或具体权益可用
  - 本能力不拥有 Membership Plan 方案目录、定价及权益定义
operations:
  create_member:
    operation_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/operations/create_member
    operation_id: create_member
    formal_object_id: q.p1.operation.create_member
    owner_capability_ref: Q.MEMBERSHIP.CAPABILITY.MEMBER@V0104
    request_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/create_member_request_contract
    response_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/create_member_response_contract
    stable_error_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/stable_errors/create_member
    outcome_contract_ref: Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}#/outcome_contracts/call_outcome
    interface_refs:
    - Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/interfaces/member_creation_invoke
    purpose: 创建唯一且可稳定引用的会员身份及基本档案。
    preconditions:
    - 请求主体已获业务授权；身份来源、原始身份值和非空展示名称有效；如提供邮箱，其内容有效。
    - 以 identity_namespace 与 identity_value 原始取值组成精确判重键，不自行进行大小写、空白转换。
    - 精确键尚不存在；并发唯一性确认与会员创建必须作为同一次原子业务动作。
    result_semantics:
    - 生成不可变的 member_ref，保存允许登记的会员资料；初始 member_status=active。
    - 会员创建本身不建立方案关系、登录账号、订单、支付或具体权益事实。
    failure_semantics:
    - 输入无效、重复身份、未授权或并发冲突拒绝创建；失败不留部分会员事实。
    x_business_design_decision_refs:
    - PD-1
    - PD-4
    - PD-6
    - PD-8
    x_business_design_owner_approved: false
  resolve_member:
    operation_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/operations/resolve_member
    operation_id: resolve_member
    formal_object_id: q.p1.operation.resolve_member
    owner_capability_ref: Q.MEMBERSHIP.CAPABILITY.MEMBER@V0104
    request_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/resolve_member_request_contract
    response_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/resolve_member_response_contract
    stable_error_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/stable_errors/resolve_member
    outcome_contract_ref: Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}#/outcome_contracts/call_outcome
    interface_refs:
    - Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/interfaces/member_resolution_invoke
    purpose: 按稳定身份读取会员及获准披露的档案与当前生命周期状态。
    preconditions:
    - 读取调用必须有业务授权和资料披露范围；按精确 member_ref 定位。
    result_semantics:
    - 即使会员已终止，也按可读取范围返回真实身份、展示资料和当前会员状态；默认不披露联系方式。
    - 只读，不建立关系、不计算资格、不修改会员。
    failure_semantics:
    - 会员不存在、身份无效或没有读取授权时，不泄露受保护资料，分别返回稳定业务错误。
    x_business_design_decision_refs:
    - PD-6
    - PD-8
    x_business_design_owner_approved: false
  update_member_profile:
    operation_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/operations/update_member_profile
    operation_id: update_member_profile
    formal_object_id: q.p1.capability.member.operation.update_member_profile
    owner_capability_ref: Q.MEMBERSHIP.CAPABILITY.MEMBER@V0104
    request_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/update_member_profile_request_contract
    response_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/update_member_profile_response_contract
    stable_error_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/stable_errors/update_member_profile
    outcome_contract_ref: Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}#/outcome_contracts/call_outcome
    interface_refs:
    - Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/interfaces/member_profile_update_invoke
    purpose: 仅修改会员可维护的展示名称和可选联系邮箱。
    preconditions:
    - 会员存在且调用者有该会员的资料修改权限。
    - 请求至少包含一个允许修改的资料字段，提供的展示名称/邮箱内容必须有效。
    - 不能修改 member_ref、原始身份组合、会员状态或方案关系；本说明书没有禁止已终止会员的合法资料修正。
    result_semantics:
    - 合法资料更改一次性生效；稳定会员身份、生命周期状态、会员关系不变。
    - 重复提交与已保存资料相同内容不产生额外会员或会员关系。
    failure_semantics:
    - 未授权、数据无效、非法修改字段、找不到会员或并发一致性失败时，保留原事实。
    x_business_design_decision_refs:
    - PD-1
    - PD-6
    - PD-8
    x_business_design_owner_approved: false
  update_member_status:
    operation_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/operations/update_member_status
    operation_id: update_member_status
    formal_object_id: q.p1.operation.update_member_status
    owner_capability_ref: Q.MEMBERSHIP.CAPABILITY.MEMBER@V0104
    request_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/update_member_status_request_contract
    response_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/update_member_status_response_contract
    stable_error_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/stable_errors/update_member_status
    outcome_contract_ref: Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}#/outcome_contracts/call_outcome
    interface_refs:
    - Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/interfaces/member_status_update_invoke
    purpose: 按唯一允许的业务迁移终止一位当前有效的会员。
    preconditions:
    - 会员存在且调用者有会员生命周期管理权限。
    - 仅允许已有 member_status=active 且目标状态 terminated；不存在暂停、恢复或重复终止迁移。
    result_semantics:
    - 原子地把该会员状态变成 terminated，记录真实业务变更时点和可追溯历史事实。
    - 不删除会员身份或历史关系，不暗中更换关系；后续资格判断按相应时点的会员状态独立判定。
    failure_semantics:
    - 会员不存在、未授权、目标状态未定义或已经终止时拒绝；重复调用不得制造第二次成功迁移。
    x_business_design_decision_refs:
    - PD-4
    - PD-6
    - PD-8
    x_business_design_owner_approved: false
  create_membership:
    operation_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/operations/create_membership
    operation_id: create_membership
    formal_object_id: q.p1.operation.create_membership
    owner_capability_ref: Q.MEMBERSHIP.CAPABILITY.MEMBER@V0104
    request_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/create_membership_request_contract
    response_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/create_membership_response_contract
    stable_error_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/stable_errors/create_membership
    outcome_contract_ref: Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}#/outcome_contracts/call_outcome
    interface_refs:
    - Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/interfaces/membership_creation_invoke
    purpose: 为已存在会员在有效业务时点建立与外部真实方案的一条有效关系。
    preconditions:
    - 有建立关系的业务授权；精确会员身份存在，且会员在拟生效时点的生命周期状态为 active。
    - 通过已声明 Membership Plan 能力精确解析目标方案，只有真实存在且 plan.state=active 才可使用。
    - 未给时点以本次业务提交时点为准；给定时点不能晚于本次提交或早于会员建立时点。
    - 该会员在拟生效时点不存在另一条生效关系；并发操作不得产生重叠有效区间。
    result_semantics:
    - 原子生成唯一 membership_ref、会员关联、目标方案、半开有效区间开始时点；关系初态 active。
    - 本候选业务设计不以支付成功为关系建立的前置条件；不生成订单、付款或具体权益事实。
    failure_semantics:
    - 会员或方案不能精确解析、不处于可用状态、授权不足、时间不合法、区间冲突或依赖不可用时，不建立新关系且保留已有事实。
    x_business_design_decision_refs:
    - PD-2
    - PD-3
    - PD-4
    - PD-6
    - PD-7
    - PD-8
    x_business_design_owner_approved: false
  update_membership_plan:
    operation_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/operations/update_membership_plan
    operation_id: update_membership_plan
    formal_object_id: q.p1.capability.member.operation.update_membership_plan
    owner_capability_ref: Q.MEMBERSHIP.CAPABILITY.MEMBER@V0104
    request_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/update_membership_plan_request_contract
    response_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/update_membership_plan_response_contract
    stable_error_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/stable_errors/update_membership_plan
    outcome_contract_ref: Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}#/outcome_contracts/call_outcome
    interface_refs:
    - Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/interfaces/membership_plan_update_invoke
    purpose: 将指定会员既有一条允许更换的关系原子地替换为另一真实有效方案；不提供续期。
    preconditions:
    - 调用者获关系更换授权；会员、明确指定的旧 membership_ref 均可精确解析，且旧关系属于该会员并处于可更换的 active 状态。
    - 目标方案从 Membership Plan 精确解析存在且 state=active，并与旧方案不同。
    - 未给生效时点使用本次提交时点，给定时点不得早于旧关系开始或晚于本次提交；不能产生重叠有效区间。
    result_semantics:
    - 在同一个业务时点原子结束旧关系并创建新关系；旧关系 state=replaced 且 termination_time 等于新关系 effective_time；新关系 state=active。
    - 返回新旧稳定关系身份与新关系生效时点；旧关系不可覆盖删除，历史时点仍可精确查。
    failure_semantics:
    - 旧关系不属于会员、不可更换或不存在，方案不存在/不适用/相同，授权不足、时间冲突或并发失败时全部回滚；不能只结束旧关系。
    - 用已替换的旧关系重复提交不得产生第二个新关系。
    x_business_design_decision_refs:
    - PD-2
    - PD-3
    - PD-4
    - PD-6
    - PD-7
    - PD-8
    x_business_design_owner_approved: false
  lookup_membership:
    operation_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/operations/lookup_membership
    operation_id: lookup_membership
    formal_object_id: q.p1.operation.lookup_membership
    owner_capability_ref: Q.MEMBERSHIP.CAPABILITY.MEMBER@V0104
    request_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/lookup_membership_request_contract
    response_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/lookup_membership_response_contract
    stable_error_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/stable_errors/lookup_membership
    outcome_contract_ref: Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}#/outcome_contracts/call_outcome
    interface_refs:
    - Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/interfaces/membership_lookup_invoke
    purpose: 按会员与当前/指定历史业务时点查询唯一生效关系。
    preconditions:
    - 读取者有相应关系数据读取权限；会员身份可精确解析。
    - 未提供 as_of_time 时以查询时点为准；提供时必须真实合法，不能回退到当前数据替代指定时点。
    result_semantics:
    - 以 effective_time <= as_of_time < termination_time 的半开区间判定；termination_time 不存在代表区间未结束。
    - 如恰有一条有效关系，返回精确会员方案关联与真实有效区间；完整事实证明无关系时返回空集合。
    - 关系状态变更不重写历史有效区间；只读，不判断资格或具体权益。
    failure_semantics:
    - 会员不存在、授权不足、时间无效、历史事实缺失或多个重叠关系导致无法唯一解释时返回稳定失败，禁止伪造单条结果。
    x_business_design_decision_refs:
    - PD-3
    - PD-4
    - PD-6
    - PD-8
    x_business_design_owner_approved: false
  evaluate_membership_eligibility:
    operation_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/operations/evaluate_membership_eligibility
    operation_id: evaluate_membership_eligibility
    formal_object_id: q.p1.operation.evaluate_membership_eligibility
    owner_capability_ref: Q.MEMBERSHIP.CAPABILITY.MEMBER@V0104
    request_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/evaluate_membership_eligibility_request_contract
    response_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/evaluate_membership_eligibility_response_contract
    stable_error_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/stable_errors/evaluate_membership_eligibility
    outcome_contract_ref: Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}#/outcome_contracts/call_outcome
    interface_refs:
    - Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/interfaces/membership_eligibility_evaluation_invoke
    purpose: 仅判断某会员在指定时点是否具有 membership_validity 资格，不判断具体权益或支付。
    preconditions:
    - 调用者获资格查询授权；check_purpose 必须为 membership_validity；decision_time 合法且不晚于处理时点。
    - 必须读取该时点会员生命周期历史和关系历史；证据缺失、重叠冲突、依赖故障或无法判断不能返回 eligible=false。
    result_semantics:
    - 当且仅当会员在该时点 active 且恰有一条时点生效关系，eligible=true，reason_code=MEMBERSHIP_VALID。
    - 【补充候选原因优先级】如会员在该时点 terminated，eligible=false，reason_code=MEMBER_TERMINATED，即使同时没有关系。
    - 如该时点会员 active 且完整历史证明没有任何生效关系，eligible=false，reason_code=NO_EFFECTIVE_MEMBERSHIP。
    - 同一会员、用途、时点与权威事实的判断结果不因不同业务调用方而改变。
    failure_semantics:
    - 没有授权、用途不支持、时间无效、会员或历史事实不能解析、关系历史互相冲突时不制造真假结论，返回稳定错误。
    x_business_design_decision_refs:
    - PD-4
    - PD-5
    - PD-6
    - PD-8
    x_business_design_owner_approved: false
  resolve_membership:
    operation_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/operations/resolve_membership
    operation_id: resolve_membership
    formal_object_id: q.p1.operation.resolve_membership
    owner_capability_ref: Q.MEMBERSHIP.CAPABILITY.MEMBER@V0104
    request_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/resolve_membership_request_contract
    response_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/contracts/resolve_membership_response_contract
    stable_error_contract_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/stable_errors/resolve_membership
    outcome_contract_ref: Q.SS.STD.P1.CONTRACT.BUSINESS_RUNTIME@${CURRENT}#/outcome_contracts/call_outcome
    interface_refs:
    - Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/interfaces/membership_exact_resolution_invoke
    purpose: 供本 Capability 内部以精确 membership_ref 解析唯一已有关系，不对外发布。
    preconditions:
    - 调用属于被允许的内部业务用途并拥有授权；有明确、非空的 membership_ref。
    result_semantics:
    - 只读取目标关系的真实存档和历史事实；即使关系已 replaced 也按指定 ID 返回，不按会员或“最新”重新选择。
    operation_attempt_maximum: 1
    x_derivation_basis: 业务说明书第四节“查询会员关系”和第三节会员关系稳定身份；不增加新的业务政策、不对外公布此接口。
    failure_semantics:
    - 标识不存在、不能唯一解析或调用未获内部授权时明确失败；不能返回另一条关系或假成功。
    x_business_design_decision_refs:
    - PD-6
    - PD-8
    x_business_design_owner_approved: false
state_model:
  mode: STATEFUL
  state_machines:
    member:
      state_machine_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/state_model/state_machines/member
      subject_schema_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/type_closure/schemas/member
      subject_identity_field_path: member_ref
      state_field_path: member_status
      allowed_business_states:
      - active
      - terminated
      initial_state: active
      terminal_states:
      - terminated
      invalid_state_stable_error_code: INVALID_STATE_TRANSITION
      operation_state_bindings:
        create_member:
          operation_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/operations/create_member
          applicability_mode: CREATES_SUBJECT
          subject_identity_cardinality: ONE
          subject_identity_input_path: null
          subject_identity_result_path: member_ref
          availability_mode: INITIALIZATION_ONLY
          allowed_states: []
          guard_rule_refs: []
          transition_refs: []
        resolve_member:
          operation_ref: Q.MEMBERSHIP.CONTRACT.CAPABILITY.MEMBER@V0104#/operations/resolve_member
          applicability_mode: EXISTING_SUBJECT
          subject_identity_cardinality: ONE
          subject_identity_input_path: member_ref
          subject_identity_result_path: null
          availability_mode: ANY_STATE
          allowed_states: []
          guard_rule_refs: []
          transition_refs: []
